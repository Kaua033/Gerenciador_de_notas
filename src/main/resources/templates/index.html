<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Portal do Aluno</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
	<style>
		:root {
          --azul-escuro: #14328c;
          --azul: #1e40af;
          --azul-claro: #eaf1fc;
          --vermelho: #d92d2d;
          --texto: #1c1f2a;
          --texto-suave: #6b7280;
          --borda: #e2e6f0;
          --fundo: #f4f6fb;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
          font-family: 'Inter', sans-serif;
          background: var(--fundo);
          color: var(--texto);
        }

        #notas-screen {
          padding: 32px 16px;
        }

        .container {
          max-width: 1080px;
          margin: 0 auto;
        }

        .topbar {
          display: flex;
          align-items: center;
          justify-content: space-between;
          margin-bottom: 28px;
        }

        .topbar-left {
          display: flex;
          align-items: center;
          gap: 12px;
        }

        .topbar .badge {
          width: 40px;
          height: 40px;
          border-radius: 10px;
          background: var(--azul-escuro);
          display: flex;
          align-items: center;
          justify-content: center;
          color: #fff;
          font-size: 20px;
        }

        .topbar .label {
          font-family: 'Poppins', sans-serif;
          font-weight: 700;
          font-size: 14px;
          letter-spacing: 0.06em;
          color: var(--azul-escuro);
          text-transform: uppercase;
        }

        .btn-sair {
          background: none;
          border: 1px solid var(--borda);
          border-radius: 10px;
          padding: 8px 16px;
          font-size: 13px;
          font-weight: 600;
          color: var(--texto-suave);
          cursor: pointer;
        }

        .btn-sair:hover { border-color: var(--vermelho); color: var(--vermelho); }

        .header-card {
          background: var(--azul-escuro);
          border-radius: 16px;
          padding: 28px 32px;
          color: #fff;
          margin-bottom: 24px;
        }

        .header-card h1 {
          font-family: 'Poppins', sans-serif;
          font-size: 26px;
          font-weight: 700;
        }

        .header-card .matricula-tag {
          font-size: 13px;
          color: #b9c8f0;
          margin-top: 6px;
          font-weight: 500;
        }

        .header-card .matricula-tag strong { color: #fff; }

        .grid {
          display: grid;
          grid-template-columns: 1.4fr 1fr;
          gap: 24px;
          margin-bottom: 24px;
        }

        .card {
          background: #fff;
          border-radius: 16px;
          border: 1px solid var(--borda);
          padding: 28px;
        }

        .card h2 {
          font-family: 'Poppins', sans-serif;
          font-size: 15px;
          font-weight: 700;
          color: var(--azul-escuro);
          margin-bottom: 20px;
        }

        .field-grid {
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 16px 20px;
        }

        .field label {
          display: block;
          font-size: 12px;
          font-weight: 600;
          color: var(--texto-suave);
          margin-bottom: 6px;
        }

        .field .value {
          width: 100%;
          border: 1px solid var(--borda);
          background: var(--azul-claro);
          border-radius: 10px;
          padding: 10px 14px;
          font-size: 14px;
          color: var(--texto);
          font-weight: 500;
        }

        .photo-card {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          text-align: center;
        }

        .photo-card img {
          width: 100%;
          max-width: 220px;
          aspect-ratio: 3 / 4;
          object-fit: cover;
          border-radius: 12px;
          margin-bottom: 16px;
        }

        .photo-card .nome-aluno {
          font-family: 'Poppins', sans-serif;
          font-weight: 700;
          font-size: 16px;
        }

        .photo-card .turma-aluno {
          font-size: 13px;
          color: var(--texto-suave);
          margin-top: 4px;
        }

        table {
          width: 100%;
          border-collapse: collapse;
          font-size: 13.5px;
        }

        thead th {
          background: var(--azul-escuro);
          color: #fff;
          text-align: left;
          padding: 12px 16px;
          font-weight: 600;
        }

        thead th:first-child { border-radius: 10px 0 0 10px; }
        thead th:last-child { border-radius: 0 10px 10px 0; text-align: center; }
        thead th.num { text-align: center; }

        tbody td {
          padding: 12px 16px;
          border-bottom: 1px solid var(--borda);
        }

        tbody td.num { text-align: center; color: var(--texto-suave); }
        tbody tr:last-child td { border-bottom: none; }
        tbody tr:nth-child(even) { background: #fafbfe; }

        .media { text-align: center; font-weight: 700; }
        .media.alta { color: #1a7a4c; }
        .media.media-tom { color: var(--azul); }

        .btn-pdf {
          margin-top: 24px;
          width: 100%;
          background: var(--azul-escuro);
          color: #fff;
          border: none;
          border-radius: 10px;
          padding: 14px;
          font-family: 'Poppins', sans-serif;
          font-weight: 700;
          font-size: 13px;
          letter-spacing: 0.05em;
          text-transform: uppercase;
          cursor: pointer;
        }

        .btn-pdf:hover { background: var(--azul); }

        @media (max-width: 800px) {
          .grid { grid-template-columns: 1fr; }
        }
	</style>
</head>
<body>

<div id="notas-screen">
	<div class="container">

		<div class="topbar">
			<div class="topbar-left">
				<div class="badge">&#127891;</div>
				<div class="label">Portal do Aluno</div>
			</div>
			<form th:action="@{/logout}" method="post">
				<button class="btn-sair" type="submit">Sair</button>
			</form>
		</div>

		<div th:if="${aluno == null}" class="card" style="text-align:center; padding:40px;">
			<h2>Aluno não encontrado</h2>
			<p style="color: var(--texto-suave); font-size: 14px; margin-top: 8px;">Não foi possível carregar os dados do aluno logado.</p>
		</div>

		<div th:if="${aluno != null}">
			<div class="header-card">
				<h1 th:text="${aluno.nome + ' ' + aluno.sobrenome}">Nome do Aluno</h1>
				<div class="matricula-tag">Matrícula: <strong th:text="${aluno.matricula}">000000000</strong></div>
			</div>

			<div class="grid">
				<div class="card">
					<h2>Dados do aluno</h2>
					<div class="field-grid">
						<div class="field"><label>Nome</label><div class="value" th:text="${aluno.nome}">—</div></div>
						<div class="field"><label>Sobrenome</label><div class="value" th:text="${aluno.sobrenome}">—</div></div>
						<div class="field"><label>Telefone</label><div class="value" th:text="${aluno.telefone ?: '—'}">—</div></div>
						<div class="field"><label>Email</label><div class="value" th:text="${aluno.email ?: '—'}">—</div></div>
						<div class="field"><label>Nome do pai</label><div class="value" th:text="${aluno.nomePai ?: '—'}">—</div></div>
						<div class="field"><label>Nome da mãe</label><div class="value" th:text="${aluno.nomeMae ?: '—'}">—</div></div>
						<div class="field"><label>Telefone do pai</label><div class="value" th:text="${aluno.telefonePai ?: '—'}">—</div></div>
						<div class="field"><label>Telefone da mãe</label><div class="value" th:text="${aluno.telefoneMae ?: '—'}">—</div></div>
					</div>
				</div>

				<div class="card photo-card">
					<img th:src="${aluno.fotoUrl ?: 'https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=400&q=80'}" alt="Foto do aluno">
					<div class="nome-aluno" th:text="${aluno.nome + ' ' + aluno.sobrenome}">Nome do Aluno</div>
					<div class="turma-aluno" th:text="'Matrícula ' + ${aluno.matricula}">Matrícula 000000000</div>
				</div>
			</div>
		</div>

	</div>
</div>

</body>
</html>
